services:
  goproxy:
    build: .
    image: goproxy:demo
    container_name: goproxy
    restart: unless-stopped
    # 多端口分流场景下端口是动态的，逐个映射很麻烦。
    # 单机场景推荐用 host 网络，路由里配什么端口就自动用什么端口。
    network_mode: host
    volumes:
      - ./config.json:/etc/goproxy/config.json:ro
    # 若改用 bridge 网络，需要逐个映射端口：
    # ports:
    #   - "80:80"
    #   - "8081:8081"
    #   - "8082:8082"
    #   - "9080:9080"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:9080/healthz"]
      interval: 30s
      timeout: 3s
      retries: 3
