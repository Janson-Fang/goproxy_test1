# 在真实 Linux 环境里跑 install.sh，验证下载 / 校验 / 安装 / 幂等性。
# 本地是 Windows，没法真正执行 ELF 二进制，这个自检必须放在 CI。
name: install-smoke

on:
  push:
    branches: [main]
    paths:
      - "install.sh"
      - ".github/workflows/install-smoke.yml"
  pull_request:
    paths:
      - "install.sh"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  install:
    name: 安装自检（${{ matrix.label }}）
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: 直连 + 固定版本
            mirror: direct
            version: v0.3.0
          - label: auto 自动选路
            mirror: auto
            version: v0.3.0
          - label: latest 版本解析
            mirror: auto
            version: ""
          # 海外 runner 访问国内镜像站不一定通，失败不代表脚本有问题
          - label: 强制走镜像（参考项）
            mirror: https://gh-proxy.com/
            version: v0.3.0
            optional: true
    continue-on-error: ${{ matrix.optional == true }}
    steps:
      - uses: actions/checkout@v4

      - name: 跑安装脚本
        env:
          MIRROR: ${{ matrix.mirror }}
          VERSION: ${{ matrix.version }}
          BIN_DIR: ${{ runner.temp }}/bin
          CONFIG_DIR: ${{ runner.temp }}/conf
        run: |
          # 先建好目录，验证「不需要 sudo」这条路径
          mkdir -p "$BIN_DIR" "$CONFIG_DIR"
          bash install.sh --no-service

      - name: 断言安装结果
        env:
          MIRROR: ${{ matrix.mirror }}
          VERSION: ${{ matrix.version }}
          BIN_DIR: ${{ runner.temp }}/bin
          CONFIG_DIR: ${{ runner.temp }}/conf
        run: |
          set -e
          test -x "$BIN_DIR/goproxy" || { echo "二进制没装上"; exit 1; }
          echo "--- 版本输出 ---"
          "$BIN_DIR/goproxy" -version
          "$BIN_DIR/goproxy" -version | grep -qv 'dev' || { echo "版本号没注入"; exit 1; }

          echo "--- 二进制确实是 Linux ELF ---"
          file "$BIN_DIR/goproxy"
          file "$BIN_DIR/goproxy" | grep -q ELF || { echo "不是 ELF"; exit 1; }

          # 配置源由**装出来的那个二进制**决定，不是由脚本决定：
          #   v0.9.0 起是 SQLite 库（goproxy.db），更早的版本是 JSON 文件。
          # 矩阵里既有固定版本（v0.3.0）又有 latest，所以两种落点都得认 ——
          # 但必须认对一个，两个都没有说明脚本哪条路都没走通。
          #
          # 判据用 -h 的自述而不是比版本号：把「v0.9.0 > v0.3.0」的语义比较
          # 搬进 CI 的 shell 里，等于又维护一份会过期的规则。
          if "$BIN_DIR/goproxy" -h 2>&1 | grep -q -- '-config-import'; then
            echo "--- 配置源：SQLite 配置库 ---"
            test -f "$CONFIG_DIR/goproxy.db" || { echo "配置库没生成"; exit 1; }
            "$BIN_DIR/goproxy" -c "$CONFIG_DIR/goproxy.db" -config-export "$RUNNER_TEMP/exported.json"
            grep -q '"routes"' "$RUNNER_TEMP/exported.json" || { echo "库里的配置导不出来"; exit 1; }
            echo "导出成功：$(wc -c < "$RUNNER_TEMP/exported.json") 字节"
          else
            echo "--- 配置源：JSON 文件（该版本还不支持 SQLite）---"
            test -f "$CONFIG_DIR/config.json" || { echo "配置文件没生成"; exit 1; }
          fi

      - name: 幂等性：重跑不能覆盖已有配置
        env:
          MIRROR: ${{ matrix.mirror }}
          VERSION: ${{ matrix.version }}
          BIN_DIR: ${{ runner.temp }}/bin
          CONFIG_DIR: ${{ runner.temp }}/conf
        run: |
          set -e
          printf '{"routes":[{"id":"keep-me"}]}' > "$CONFIG_DIR/config.json"
          bash install.sh --no-service
          grep -q 'keep-me' "$CONFIG_DIR/config.json" || { echo "已有配置文件被覆盖了"; exit 1; }
          test -f "$CONFIG_DIR/config.json.example" || { echo "新示例没另存"; exit 1; }

          # 新版还有一层更重要的幂等性：**不能拿这份过时的 config.json 去覆盖库**。
          # 库才是配置的真源，控制台里改过的路由只落在库里 —— 重跑一次安装就把
          # 它们回退成安装时那份文件，是最难发现的一类事故（导入还会报成功）。
          if [ -f "$CONFIG_DIR/goproxy.db" ]; then
            "$BIN_DIR/goproxy" -c "$CONFIG_DIR/goproxy.db" -config-export "$RUNNER_TEMP/idem.json"
            if grep -q 'keep-me' "$RUNNER_TEMP/idem.json"; then
              echo "配置库被那份过时的 config.json 顶掉了"; exit 1
            fi
            echo "配置库没被 config.json 顶掉 OK"
          fi
          echo "幂等性 OK"

      - name: 冒烟：二进制能起来并加载配置
        env:
          BIN_DIR: ${{ runner.temp }}/bin
          CONFIG_DIR: ${{ runner.temp }}/conf
        run: |
          set -e
          # 用一份最小配置起服务，确认能正常监听管理端口。
          #
          # 配置源不同，起法也不同：v0.9.0 起 `-c` 指向库，得先把这份 JSON
          # 导进去；更早的版本直接 `-c` 指这个文件。写死一种就会在另一半矩阵上
          # 失败 —— 而失败信息看起来像「二进制起不来」，跟真正的原因差很远。
          cat > "$CONFIG_DIR/smoke.json" <<'CFG'
          {
            "admin_addr": "127.0.0.1:19080",
            "admin_token": "smoke-token",
            "routes": [
              { "id": "smoke", "listen_port": 18080, "path_prefix": "/",
                "target": "http://127.0.0.1:19001" }
            ]
          }
          CFG

          if "$BIN_DIR/goproxy" -h 2>&1 | grep -q -- '-config-import'; then
            echo "--- 经 -config-import 装进配置库 ---"
            "$BIN_DIR/goproxy" -c "$CONFIG_DIR/smoke.db" -config-import "$CONFIG_DIR/smoke.json"
            SMOKE_CFG="$CONFIG_DIR/smoke.db"
          else
            SMOKE_CFG="$CONFIG_DIR/smoke.json"
          fi

          "$BIN_DIR/goproxy" -c "$SMOKE_CFG" -text-log > "$RUNNER_TEMP/gp.log" 2>&1 &
          GP=$!
          for i in $(seq 1 20); do
            if curl -fsS --max-time 2 -H 'Authorization: Bearer smoke-token' \
                 http://127.0.0.1:19080/_goproxy/ports >/dev/null 2>&1; then break; fi
            sleep 0.5
          done
          echo "--- 管理端点 ---"
          curl -fsS --max-time 3 -H 'Authorization: Bearer smoke-token' http://127.0.0.1:19080/_goproxy/ports
          echo
          curl -fsS --max-time 3 -H 'Authorization: Bearer smoke-token' http://127.0.0.1:19080/_goproxy/routes | head -c 300
          echo
          kill $GP 2>/dev/null || true
          echo "--- 启动日志 ---"
          head -5 "$RUNNER_TEMP/gp.log"
          echo "冒烟测试 OK"

  # 「重跑 install.sh 能不能直接升级」这件事必须真在 Linux 上验，
  # 因为要覆盖一个**正在运行**的 ELF 二进制 —— 这是 ETXTBSY 的高发场景。
  upgrade:
    name: 升级自检（就地覆盖运行中的二进制）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 首次安装
        env:
          MIRROR: direct
          VERSION: v0.3.0
          BIN_DIR: ${{ runner.temp }}/ubin
          CONFIG_DIR: ${{ runner.temp }}/uconf
        run: |
          set -e
          mkdir -p "$BIN_DIR" "$CONFIG_DIR"
          bash install.sh --no-service
          test -x "$BIN_DIR/goproxy"

      - name: 备份基线，并把二进制跑起来
        env:
          BIN_DIR: ${{ runner.temp }}/ubin
          CONFIG_DIR: ${{ runner.temp }}/uconf
        run: |
          set -e
          # 用自己的配置，稍后要断言升级一个字都没动它
          cat > "$CONFIG_DIR/config.json" <<'CFG'
          {
            "admin_addr": "127.0.0.1:19080",
            "routes": [
              { "id": "upgrade", "listen_port": 18080, "path_prefix": "/",
                "target": "http://127.0.0.1:19001" }
            ]
          }
          CFG
          sha256sum "$CONFIG_DIR/config.json" > "$RUNNER_TEMP/cfg.sha"
          cp "$BIN_DIR/goproxy" "$RUNNER_TEMP/before.bin"

          # 关键：让这个二进制真的处于「正在执行」状态。
          nohup "$BIN_DIR/goproxy" -c "$CONFIG_DIR/config.json" -text-log \
                > "$RUNNER_TEMP/up.log" 2>&1 &
          echo $! > "$RUNNER_TEMP/up.pid"
          for _ in $(seq 1 20); do
            curl -fsS --max-time 2 http://127.0.0.1:19080/_goproxy/ports >/dev/null 2>&1 && break
            sleep 0.5
          done
          ps -p "$(cat "$RUNNER_TEMP/up.pid")" -o pid,cmd
          echo "旧版本已经跑起来了"

      - name: 重跑安装脚本完成升级
        env:
          MIRROR: direct
          VERSION: v0.3.0
          BIN_DIR: ${{ runner.temp }}/ubin
          CONFIG_DIR: ${{ runner.temp }}/uconf
        run: |
          # 这里唯一的硬断言就是「退出码为 0」。
          # 如果替换运行中的二进制踩到 Text file busy，脚本会在这里直接挂掉。
          bash install.sh --no-service
          echo "重跑退出码 0 —— 覆盖运行中的二进制没有 ETXTBSY"

      - name: 断言升级结果
        env:
          BIN_DIR: ${{ runner.temp }}/ubin
          CONFIG_DIR: ${{ runner.temp }}/uconf
        run: |
          set -e

          echo "--- 旧二进制已备份，可用于回滚 ---"
          test -x "$BIN_DIR/goproxy.old" || { echo "没有生成 goproxy.old"; exit 1; }
          cmp "$BIN_DIR/goproxy.old" "$RUNNER_TEMP/before.bin" \
            || { echo "goproxy.old 与升级前的二进制不一致"; exit 1; }

          echo "--- 已有 config.json 字节级未变 ---"
          sha256sum -c "$RUNNER_TEMP/cfg.sha"
          grep -q upgrade "$CONFIG_DIR/config.json"

          echo "--- 新示例另存为 .example，没有顶掉用户配置 ---"
          test -f "$CONFIG_DIR/config.json.example"

          echo "--- 升级前启动的进程仍然活着（rename 不影响运行中的旧 inode）---"
          ps -p "$(cat "$RUNNER_TEMP/up.pid")" >/dev/null \
            || { echo "升级过程把运行中的进程弄死了"; exit 1; }

          kill "$(cat "$RUNNER_TEMP/up.pid")" 2>/dev/null || true
          echo "升级自检 OK"

  # 单元文件在升级时是会被覆盖的，用户往里加的自定义项必须先备份下来。
  # 这里把 SYSTEMD_DIR / STATE_DIR 指到临时目录，就能在没有 root 的 runner 上验这条路径。
  unit-file:
    name: 升级自检（systemd 单元先备份再重写）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 预置一份被用户改过的单元文件
        env:
          SYSTEMD_DIR: ${{ runner.temp }}/units
        run: |
          set -e
          mkdir -p "$SYSTEMD_DIR"
          cat > "$SYSTEMD_DIR/goproxy.service" <<'UNIT'
          [Service]
          Environment=GOPROXY_EXTRA=1
          LimitNOFILE=65535
          UNIT
          grep -q LimitNOFILE "$SYSTEMD_DIR/goproxy.service"

      - name: 跑安装脚本（走 systemd 分支）
        env:
          MIRROR: direct
          VERSION: v0.3.0
          BIN_DIR: ${{ runner.temp }}/sbin
          CONFIG_DIR: ${{ runner.temp }}/sconf
          SYSTEMD_DIR: ${{ runner.temp }}/units
          STATE_DIR: ${{ runner.temp }}/sstate
        run: |
          set -e
          mkdir -p "$BIN_DIR" "$CONFIG_DIR"
          # 不带 --no-service，让脚本去写单元文件
          bash install.sh

      - name: 断言自定义项被备份、新单元指向本次路径
        env:
          SYSTEMD_DIR: ${{ runner.temp }}/units
          BIN_DIR: ${{ runner.temp }}/sbin
        run: |
          set -e
          test -x "$BIN_DIR/goproxy"

          echo "--- 备份里保住了用户自定义项 ---"
          test -f "$SYSTEMD_DIR/goproxy.service.bak" || { echo "单元文件没有被备份"; exit 1; }
          grep -q LimitNOFILE "$SYSTEMD_DIR/goproxy.service.bak"
          grep -q GOPROXY_EXTRA "$SYSTEMD_DIR/goproxy.service.bak"

          echo "--- 新单元指向本次的 BIN_DIR ---"
          grep -q "$BIN_DIR/goproxy" "$SYSTEMD_DIR/goproxy.service"

          if grep -q LimitNOFILE "$SYSTEMD_DIR/goproxy.service"; then
            echo "新单元里残留了旧自定义项，不符合预期"; exit 1
          fi

          echo "--- 新单元内容 ---"
          cat "$SYSTEMD_DIR/goproxy.service"

  # v0.8.x → v0.9.x 这条升级路是本次发版的关键路径：老版本配置在 config.json 里，
  # 新版本把真源换成了 SQLite 库，中间靠「库为空时导入同目录 config.json 一次」接上。
  #
  # 配置层的那一步有单测（configstore_test.go 的首次导入），但**装出来之后**
  # 「脚本 + 服务 + 库」串起来能不能用，只有真 Linux 上跑得出来。少了这个 job，
  # 「升级完路由全丢」要等用户装上去才会发现。
  upgrade-sqlite:
    name: 升级自检（v0.8.x 的 config.json → 最新版 SQLite 库）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 装一份旧版（v0.8.0）并用 config.json 跑起来
        env:
          MIRROR: direct
          VERSION: v0.8.0
          BIN_DIR: ${{ runner.temp }}/qbin
          CONFIG_DIR: ${{ runner.temp }}/qconf
        run: |
          set -e
          mkdir -p "$BIN_DIR" "$CONFIG_DIR"
          bash install.sh --no-service

          # 先确认装出来的确实是「JSON 文件」那一版 —— 否则后面的断言会变成
          # 「拿新版验新版」，看起来全过，实际没覆盖到升级路径。
          "$BIN_DIR/goproxy" -version
          if "$BIN_DIR/goproxy" -h 2>&1 | grep -q -- '-config-import'; then
            echo "v0.8.0 竟然支持 -config-import，这个 job 的前提不成立了"; exit 1
          fi

          # 一份「用户自己改过」的配置：只留一条有辨识度的路由。
          # 升级之后它必须原封不动地出现在库里。
          cat > "$CONFIG_DIR/config.json" <<'CFG'
          {"admin_addr":"127.0.0.1:19080","admin_token":"upgrade-token","routes":[{"id":"survives-upgrade","name":"升级前就有的路由","listen_port":18080,"path_prefix":"/","target":"http://127.0.0.1:19001"}]}
          CFG
          sha256sum "$CONFIG_DIR/config.json" > "$RUNNER_TEMP/qcfg.sha"

          nohup "$BIN_DIR/goproxy" -c "$CONFIG_DIR/config.json" -text-log \
                > "$RUNNER_TEMP/qup.log" 2>&1 &
          echo $! > "$RUNNER_TEMP/qup.pid"
          for _ in $(seq 1 20); do
            curl -fsS --max-time 2 -H 'Authorization: Bearer upgrade-token' \
              http://127.0.0.1:19080/_goproxy/ports >/dev/null 2>&1 && break
            sleep 0.5
          done
          curl -fsS --max-time 3 -H 'Authorization: Bearer upgrade-token' \
            http://127.0.0.1:19080/_goproxy/routes | grep -q 'survives-upgrade'
          ps -p "$(cat "$RUNNER_TEMP/qup.pid")" -o pid,cmd
          echo "旧版（v0.8.0）已经用 config.json 跑起来了"

      - name: 重跑安装脚本完成升级（装最新版）
        env:
          MIRROR: direct
          BIN_DIR: ${{ runner.temp }}/qbin
          CONFIG_DIR: ${{ runner.temp }}/qconf
        run: |
          set -e
          bash install.sh --no-service
          "$BIN_DIR/goproxy" -version

      - name: 断言配置真的迁进库了，而且原文件没被动
        env:
          BIN_DIR: ${{ runner.temp }}/qbin
          CONFIG_DIR: ${{ runner.temp }}/qconf
        run: |
          set -e
          test -x "$BIN_DIR/goproxy.old" || { echo "升级前没有备份旧二进制"; exit 1; }
          test -f "$CONFIG_DIR/goproxy.db" || { echo "升级后没有配置库"; exit 1; }

          echo "--- 用户那条路由进了库 ---"
          "$BIN_DIR/goproxy" -c "$CONFIG_DIR/goproxy.db" -config-export "$RUNNER_TEMP/q.json"
          grep -q 'survives-upgrade' "$RUNNER_TEMP/q.json" \
            || { echo "升级把用户的路由弄丢了："; cat "$RUNNER_TEMP/q.json"; exit 1; }

          echo "--- 凭据也跟过去了 ---"
          grep -q 'upgrade-token' "$RUNNER_TEMP/q.json" || { echo "admin_token 没迁进库"; exit 1; }

          echo "--- 原 config.json 字节级未变（它只剩备份用途）---"
          sha256sum -c "$RUNNER_TEMP/qcfg.sha"

          echo "--- 升级前的进程仍然活着（rename 不影响运行中的旧 inode）---"
          ps -p "$(cat "$RUNNER_TEMP/qup.pid")" >/dev/null \
            || { echo "升级过程把运行中的旧进程弄死了"; exit 1; }
          kill "$(cat "$RUNNER_TEMP/qup.pid")" 2>/dev/null || true
          sleep 1

      - name: 新版用配置库起来，路由照常服务
        env:
          BIN_DIR: ${{ runner.temp }}/qbin
          CONFIG_DIR: ${{ runner.temp }}/qconf
        run: |
          set -e
          nohup "$BIN_DIR/goproxy" -c "$CONFIG_DIR/goproxy.db" -text-log \
                > "$RUNNER_TEMP/qnew.log" 2>&1 &
          QP=$!
          for _ in $(seq 1 20); do
            curl -fsS --max-time 2 -H 'Authorization: Bearer upgrade-token' \
              http://127.0.0.1:19080/_goproxy/ports >/dev/null 2>&1 && break
            sleep 0.5
          done
          echo "--- 库里加载出来的路由 ---"
          curl -fsS --max-time 3 -H 'Authorization: Bearer upgrade-token' \
            http://127.0.0.1:19080/_goproxy/routes | grep -q 'survives-upgrade' \
            || { echo "新版起不来，或路由没从库里加载出来："; cat "$RUNNER_TEMP/qnew.log"; kill $QP 2>/dev/null || true; exit 1; }
          kill $QP 2>/dev/null || true
          echo "升级路径自检 OK"
