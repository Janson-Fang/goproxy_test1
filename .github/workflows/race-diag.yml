# 临时诊断用：把 -race 测试的完整输出提交到 ci-logs 分支，便于在本地拿不到 CI 日志时排查。
name: race-diag

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: 跑 race 测试
        run: |
          go test -race -v -count=1 ./... > race-output.txt 2>&1
          echo "=== exit=$? ===" >> race-output.txt
          go env CGO_ENABLED CC >> race-output.txt
      - name: 输出尾部（便于页面查看）
        run: tail -100 race-output.txt
      - name: 提交输出
        run: |
          git config user.name ci-bot
          git config user.email ci-bot@users.noreply.github.com
          git add -f race-output.txt
          git commit -m "race output $(date -u +%Y%m%dT%H%M%SZ)"
          git push -f origin HEAD:refs/heads/ci-logs
