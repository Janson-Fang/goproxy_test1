name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]

permissions:
  contents: read

# 连续推送时只保留最新一次，省额度
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  console:
    name: 管理控制台构建与一致性
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: 安装依赖
        working-directory: web
        run: npm ci --no-audit --no-fund

      - name: 类型检查
        working-directory: web
        run: npm run typecheck

      - name: 构建
        working-directory: web
        run: npm run build

      # web/dist 是提交进仓库的（go:embed 要求它必须存在，否则别人 clone 下来
      # 直接 go build 会编译失败）。所以必须挡住「改了前端却忘了重新构建」——
      # 否则仓库里的产物会悄悄过期，不跑 Node 的构建流程会嵌进旧界面。
      - name: 检查提交的 web/dist 是否与源码一致
        run: |
          if ! git diff --quiet -- web/dist; then
            echo "::error::web/dist 与源码不一致。请在本地执行 cd web && npm run build 后提交产物。"
            git --no-pager diff --stat -- web/dist
            exit 1
          fi
          echo "web/dist 与源码一致"

  test:
    name: 测试与静态检查
    needs: console
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: 格式检查
        run: |
          bad=$(gofmt -l .)
          if [ -n "$bad" ]; then
            echo "以下文件未通过 gofmt，请本地执行 gofmt -w ."
            echo "$bad"
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      - name: 单元测试（带竞态检测）
        run: go test -race -coverprofile=coverage.out ./...

      - name: 覆盖率概要
        run: go tool cover -func=coverage.out | tail -1

  build:
    name: 交叉编译 ${{ matrix.goos }}/${{ matrix.goarch }}
    needs: console
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        goos: [linux]
        goarch: [amd64, arm64]
    steps:
      # fetch-depth: 0 —— 版本号改用 `git describe` 推导，需要完整的 tag 与历史。
      # 浅克隆下拿不到 tag，会退化成裸的 commit sha。
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      # 即使 web/dist 是提交好的，这里也重新构建一遍：
      # 保证发布出去的控制台一定和源码对应，而不是依赖某次本地构建的产物。
      - name: 构建管理控制台
        working-directory: web
        run: |
          npm ci --no-audit --no-fund
          npm run build

      # 版本串一律由 git 推导，不要用 github.ref_name：
      # 分支构建时它是分支名，二进制会显示成 `goproxy main`，看不出对应哪段代码；
      # tag 构建时两者恰好一致（都是 v0.4.0）。
      #   tag 上          → v0.4.0
      #   tag 之后有提交  → v0.3.0-9-gef38364   ← 分支构建的实际形态
      - name: 计算版本号
        id: ver
        run: echo "version=$(git describe --tags --always)" >> "$GITHUB_OUTPUT"

      - name: 编译
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
          VERSION: ${{ steps.ver.outputs.version }}
          COMMIT: ${{ github.sha }}
        run: |
          mkdir -p dist
          go build -trimpath \
            -ldflags="-s -w -X main.version=${VERSION} -X main.commit=${COMMIT:0:7}" \
            -o dist/goproxy .
          go build -trimpath -o dist/goproxy-backend ./backend
          cp config.example.json README.md LICENSE dist/
          tar -czf goproxy-${{ matrix.goos }}-${{ matrix.goarch }}.tar.gz -C dist .
          sha256sum goproxy-${{ matrix.goos }}-${{ matrix.goarch }}.tar.gz \
            > SHA256SUMS-${{ matrix.goarch }}.txt
          cat SHA256SUMS-${{ matrix.goarch }}.txt

      - uses: actions/upload-artifact@v4
        with:
          name: goproxy-${{ matrix.goos }}-${{ matrix.goarch }}
          path: |
            goproxy-*.tar.gz
            SHA256SUMS-*.txt
          if-no-files-found: error

  docker:
    name: 构建镜像
    needs: console
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 计算版本号
        id: ver
        run: echo "version=$(git describe --tags --always)" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: 登录 ghcr.io
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=sha,format=short

      # 镜像里的前端资源来自提交好的 web/dist（.dockerignore 特意保留了它），
      # 所以 Docker 构建不需要 Node，上面那个 console 任务已经保证产物是最新的。
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ steps.ver.outputs.version }}
            COMMIT=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  release:
    name: 发布 Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.tar.gz
            dist/SHA256SUMS-*.txt
          generate_release_notes: true
