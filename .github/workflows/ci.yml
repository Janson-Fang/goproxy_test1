  release:
    name: 发布 Release
    if: startsWith(github.ref, 'refs/tags/v')
    # 必须同时等 test。`test` 与 `build` 是并列兄弟（都只 needs: console），
    # 这里原来只写 needs: build，于是**测试红了的 tag 照样会把 Release 发出去** ——
    # CI 页面上 test 是红的、Release 却建出来了，两者谁也不拦谁，完全静默。
    # 改成列表之后：测试不过就不发，tag 留在那儿，修完重跑这次 run（或重打一个 tag）。
    needs: [build, test]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # 这里**不再需要** fetch-depth: 0。曾经要用它来保证本地能读到 tag 对象，
      # 但那条路本身不可靠（见下面「第三次踩」那段：checkout 会把 refs/tags/<tag>
      # 重写成轻量标签），现在说明一律走 API 读，服务端权威，与本地克隆深度无关。
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      # 先把产物挂上去，再单独生成 release notes。
      #
      # 分开的理由：generate_release_notes 会调 GitHub 的「按 tag 差异生成说明」
      # 接口，那一路可能在 tag 刚推送、差异计算还没就绪时失败。
      # 两件事耦合在一起时，一次 notes 失败会让**整个发布**失败 ——
      # 二进制明明编译好了却一个都没挂上去（v0.5.0 就踩到了这一次）。
      # 拆开之后，最坏情况只是 notes 是空的，产物一定在。
      #
      # ⚠ prerelease 由 tag 名决定，别删这一行。
      #
      # tag 名里带 `-` 就是 semver 的预发布（v0.14.0-rc.1、v0.15.0-beta.2），
      # 必须标成 prerelease。不标的话它会**静默**变成 `latest` ——
      # GitHub 的 /releases/latest 定义是「最近的**非预发布**、非草稿 Release」，
      # 而 install.sh 的 latest 就是走它解析的。于是：
      #   · 只想试测试版的你，装到的确实是测试版（这一步符合预期）；
      #   · 但所有 **`install.sh` 的用户**也会在不知情的情况下装上测试版，
      #     而他们没有任何办法从 UI 上看出来（版本号是 v0.14.0-rc.1，看着挺正式）。
      # 没有任何报错、日志也不会提一句 —— 与「取错发布说明」属于同一类静默失效。
      - name: 上传产物并创建 Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.tar.gz
            dist/SHA256SUMS-*.txt
          prerelease: ${{ contains(github.ref_name, '-') }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # ⚠ 这一步的语义是「把说明拼起来」，不是「用生成的说明覆盖掉」。
      #
      # 踩过两次：
      #   1. 用 softprops/action-gh-release 的 generate_release_notes（v0.5.0），
      #      它会让 release 只有一行 auto changelog；
      #   2. 用 `gh release edit --notes "$notes"`（v0.6.0），**同样是整体替换** ——
      #      亲手写在 tag 上的说明被 88 字节的 "Full Changelog" 冲掉。
      #
      # 现在的约定：**手写的发布说明写在 annotated tag 的 message 里**
      # （`git tag -a v0.6.0 -F notes.md`，第一行会被当成标题丢掉，
      #   所以正文从第二行起）。CI 把它取出来当正文，auto changelog 只作附录。
      # 这样发布说明跟着 tag 走、有版本控制、且不依赖任何手动点击。
      #
      # ⚠ 第三次踩（v0.7.0）：**不能用本地 git 读 tag 说明。**
      #
      # actions/checkout 在 tag 触发的 run 里会先 `git rev-parse` 把 tag 解析成
      # 它指向的 commit sha，再执行
      #   git fetch --no-tags ... origin +<commit-sha>:refs/tags/<tag>
      # 于是本地 `refs/tags/<tag>` 被**重写成指向 commit 的轻量标签**
      # （日志里能看到那一行；上面那句 fetch-depth: 0 的注释也因此失效）。
      # 而 `git for-each-ref ... %(contents:body)` 对轻量标签返回的是
      # **提交信息** —— 脚本不报错，只是安静地把 commit message 当成发布说明发出去。
      # v0.7.0 就这么发了一版，正文是提交信息。
      #
      # 所以改成走 API 读 tag 对象：服务端权威，不受本地 ref 改写影响，
      # 而且**读完能立刻判断「这到底是不是一条 annotated tag」**。
      # 也刻意不保留 git 那条路 —— 一个会静默取到错误文本的回退，
      # 比直接失败危险得多。
      - name: 生成 Release 说明
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          set -eu
          repo="${{ github.repository }}"

          # tag 对象本身。annotated tag 的 ref 指向一个 tag 对象；
          # 轻量标签的 ref 直接指向 commit（那种情况本来就没有说明）。
          ref_json=$(gh api "repos/$repo/git/ref/tags/$TAG" 2>/dev/null || true)
          obj_type=$(printf '%s' "$ref_json" | jq -r '.object.type // empty' 2>/dev/null || true)
          obj_sha=$(printf '%s' "$ref_json" | jq -r '.object.sha // empty' 2>/dev/null || true)
          echo "tag $TAG -> object.type=$obj_type sha=$obj_sha"

          tag_notes=""
          if [ "$obj_type" = "tag" ]; then
            # 第一行是标题（release 名已经是它了），正文从第二行起 —— 与旧约定一致。
            tag_notes=$(gh api "repos/$repo/git/tags/$obj_sha" --jq .message 2>/dev/null \
              | tail -n +2 || true)
          fi
          # 把取到的正文打一行出来。这一步是为了让「取错来源」在日志里可见 ——
          # 之前那次就是因为它完全不可见，才没人发现发出去的是提交信息。
          echo "tag 说明首行：$(printf '%s' "$tag_notes" | head -n 1)"

          changelog=$(gh api "repos/$repo/releases/generate-notes" \
            -f tag_name="$TAG" --jq .body 2>/dev/null || true)

          # 拼装：手写正文在前，auto changelog 作为附录在后。
          if [ -n "${tag_notes:-}" ] && [ -n "${changelog:-}" ]; then
            body=$(printf '%s\n\n---\n\n%s\n' "$tag_notes" "$changelog")
          elif [ -n "${tag_notes:-}" ]; then
            body="$tag_notes"
          elif [ -n "${changelog:-}" ]; then
            echo "::warning::tag $TAG 没有说明（object.type=$obj_type），本次 Release 只有 auto changelog"
            body="$changelog"
          else
            echo "::warning::tag 没有说明、auto changelog 也拿不到，保留 Release 现状"
            exit 0
          fi

          printf '%s' "$body" > /tmp/relnotes.md
          # 用 --notes-file 而不是 --notes：正文里有表格、代码块、反引号，
          # 直接当参数传会被 shell 吃掉引号。
          gh release edit "$TAG" --notes-file /tmp/relnotes.md
          echo "Release 说明已更新，正文 $(wc -c < /tmp/relnotes.md) 字节"

      # 断言产物真的挂上去了 —— 否则「发布成功」只是自我感觉良好。
      # 顺带断言预发布标记与 tag 名一致：漏标就会抢走 latest（见上面那段注释），
      # 而这种事在发布当时看不出任何异常，只有等 install.sh 的用户装上测试版才现形。
      - name: 校验产物齐全与预发布标记
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          tag="${{ github.ref_name }}"
          # 等几秒让 release 落库
          sleep 3
          assets=$(gh release view "$tag" --json assets --jq '.assets[].name')
          echo "已挂载产物："
          echo "$assets"
          for want in goproxy-linux-amd64.tar.gz goproxy-linux-arm64.tar.gz \
                      SHA256SUMS-amd64.txt SHA256SUMS-arm64.txt; do
            echo "$assets" | grep -qx "$want" || {
              echo "::error::Release $tag 缺少产物 $want"; exit 1; }
          done
          echo "四个产物齐全"

          want_pre=false
          case "$tag" in *-*) want_pre=true ;; esac
          got_pre=$(gh release view "$tag" --json isPrerelease --jq '.isPrerelease' 2>/dev/null || echo "取不到")
          if [ "$got_pre" != "$want_pre" ]; then
            echo "::error::tag $tag 的 prerelease 应为 $want_pre，实际 $got_pre。"\
              "带 - 的 tag 是预发布，漏标它会成为 /releases/latest，让 install.sh 的用户装上测试版。"
            exit 1
          fi
          echo "prerelease=$got_pre（与 tag 名一致）"
