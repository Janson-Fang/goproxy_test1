    <!--
      首屏主题脚本必须是**同步的普通脚本**（不能加 type="module"，也不能加 defer）：
      module 要等 DOM 解析完才执行，那时默认主题已经渲染过一帧，浅色用户会看到闪烁。

      它也不能内联 —— 内联脚本会让 CSP 不得不放开 'unsafe-inline'。
      见 public/theme.js 的注释。
    -->
    <script src="./theme.js"></script>
    <script type="module" crossorigin src="/_goproxy/ui/assets/index-BC1dCQEE.js"></script>
